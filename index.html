const pages={
&quot;1914&quot;: `&lt;div class=&quot;screen map1914&quot;&gt;
&lt;div class=&quot;copy&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;1914 · Guerra de Movimentos&lt;/div&gt;
&lt;div class=&quot;title&quot;&gt;Uma guerra que se esperava rápida.&lt;/div&gt;
&lt;div class=&quot;text&quot;&gt;Observa no mapa as &lt;b&gt;frentes em 1914 e em 1917&lt;/b&gt;. O espaço ajuda-nos a perceber o que aconteceu.&lt;/div&gt;
&lt;div class=&quot;prompt&quot;&gt;O mapa mostra avanço decisivo ou uma frente estabilizada?
&lt;div class=&quot;answer&quot;&gt;→ Uma &lt;b&gt;frente estabilizada&lt;/b&gt;. A ofensiva alemã não conseguiu uma vitória rápida; a guerra prolongou-se e deu lugar à guerra das trincheiras.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;visual&quot;&gt;&lt;img src=&quot;${MAP}&quot;&gt;
&lt;div class=&quot;source&quot;&gt;&lt;b&gt;A I Guerra Mundial entre 1914-1917.&lt;/b&gt; A existência de confrontos em África e na Ásia, devido aos interesses coloniais, mundializou o conflito. No entanto, as principais frentes de combate desenrolaram-se na Europa, onde decorreram as mais violentas batalhas.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`,

&quot;1517&quot;: `&lt;div class=&quot;screen&quot;&gt;
&lt;div class=&quot;copy&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;1915–1917 · Guerra das Trincheiras&lt;/div&gt;
&lt;div class=&quot;title&quot;&gt;Muito combate.&lt;br&gt;Pouco avanço.&lt;/div&gt;
&lt;div class=&quot;text&quot;&gt;As frentes estabilizam. A guerra transforma-se numa luta prolongada de desgaste.&lt;/div&gt;
&lt;div class=&quot;quote&quot;&gt;«O fogo continua, mas avançou pouco (…) As metralhadoras disparam (…) Os do outro lado tentam avançar.»&lt;br&gt;&lt;b&gt;Erich Maria Remarque, &lt;i&gt;A Oeste Nada de Novo&lt;/i&gt;&lt;/b&gt;&lt;/div&gt;
&lt;div class=&quot;prompt&quot;&gt;Que sinais de desgaste observas na imagem?
&lt;div class=&quot;answer&quot;&gt;→ Trincheiras, condições difíceis, destruição e combate prolongado. As frentes avançavam pouco apesar da enorme violência.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;visual trench&quot;&gt;&lt;img src=&quot;${TRENCH}&quot;&gt;
&lt;div class=&quot;source&quot;&gt;&lt;b&gt;Fonte:&lt;/b&gt; Soldados britânicos saem da trincheira durante a Batalha do Somme, França, 1916. Fotografia: Fototeca Gilardi / Getty Images.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`,

&quot;1917&quot;: `&lt;div class=&quot;screen&quot;&gt;
&lt;div class=&quot;copy&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;1917 · O equilíbrio muda&lt;/div&gt;
&lt;div class=&quot;title&quot;&gt;Um sai.&lt;br&gt;Outro entra.&lt;/div&gt;
&lt;div class=&quot;text&quot;&gt;&lt;b&gt;Rússia:&lt;/b&gt; inicia a retirada do conflito após as revoluções de 1917.&lt;br&gt;&lt;b&gt;Estados Unidos:&lt;/b&gt; entram na guerra e reforçam os Aliados.&lt;/div&gt;
&lt;div class=&quot;prompt&quot;&gt;Porque é que 1917 altera o equilíbrio da guerra?
&lt;div class=&quot;answer&quot;&gt;→ A &lt;b&gt;Rússia inicia a saída&lt;/b&gt;, permitindo progressivamente à Alemanha deslocar forças para Ocidente; mas os &lt;b&gt;EUA entram&lt;/b&gt; e reforçam os Aliados com tropas e recursos.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;visual&quot;&gt;&lt;div class=&quot;synthesis&quot;&gt;
&lt;div class=&quot;side&quot;&gt;&lt;div class=&quot;flag&quot;&gt;🇷🇺&lt;/div&gt;&lt;div class=&quot;country&quot;&gt;RÚSSIA&lt;/div&gt;&lt;div class=&quot;action&quot;&gt;PREPARA A SAÍDA&lt;/div&gt;&lt;div class=&quot;detail&quot;&gt;Revoluções Russas · 1917&lt;br&gt;O governo bolchevique negoceia a saída, concretizada em 1918.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;middle&quot;&gt;&lt;strong&gt;1917&lt;/strong&gt;&lt;div&gt;O EQUILÍBRIO MUDA&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;side&quot;&gt;&lt;div class=&quot;flag&quot;&gt;🇺🇸&lt;/div&gt;&lt;div class=&quot;country&quot;&gt;ESTADOS UNIDOS&lt;/div&gt;&lt;div class=&quot;action&quot;&gt;ENTRAM NA GUERRA&lt;/div&gt;&lt;div class=&quot;detail&quot;&gt;Abril de 1917&lt;br&gt;Homens, recursos e capacidade industrial reforçam os Aliados.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;&lt;div class=&quot;source&quot;&gt;&lt;b&gt;Fonte:&lt;/b&gt; síntese visual de autoria própria.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`,

&quot;1918&quot;: `&lt;div class=&quot;end&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Fim do feedback · início da aula&lt;/div&gt;&lt;div class=&quot;years&quot;&gt;1918 ?&lt;/div&gt;&lt;p&gt;Já sabemos que, em 1917, o equilíbrio da guerra se alterou.&lt;/p&gt;&lt;div class=&quot;title&quot;&gt;Como se chegou ao fim da guerra?&lt;/div&gt;&lt;/div&gt;`
};

const panel=document.getElementById('panel');

document.querySelectorAll('.date').forEach(btn=&gt;{
  btn.addEventListener('click', function(ev){
    ev.preventDefault();
    ev.stopPropagation();
    document.querySelectorAll('.date').forEach(b=&gt;b.classList.remove('active'));
    this.classList.add('active');
    panel.innerHTML=pages[this.dataset.key];
  });
});

panel.addEventListener('click', function(ev){
  const prompt=ev.target.closest('.prompt');
  if(!prompt) return;
  ev.preventDefault();
  ev.stopPropagation();
  const answer=prompt.querySelector('.answer');
  if(answer) answer.classList.toggle('show');
});
&lt;/script&gt;
